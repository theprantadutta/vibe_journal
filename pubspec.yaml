name: vibe_journal
description: "A new Flutter project."

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  record: ^6.0.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  haptic_feedback: ^0.5.1+1
  get_it: ^9.0.5
  shared_preferences: ^2.5.3
  firebase_storage: ^13.0.4
  table_calendar: ^3.2.0
  just_audio: ^0.10.4
  flutter_sound: ^9.28.0
  fl_chart: ^1.0.0
  cloud_functions: ^6.0.4
  rxdart: ^0.28.0

  collection: any
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.2.1
  local_auth: ^3.0.0
  simple_animations: ^5.2.0
  flutter_native_splash: ^2.4.6
  permission_handler: ^12.0.0+1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  confetti: ^0.8.0
  audioplayers: ^6.1.0
  provider: ^6.1.2
  google_sign_in: ^7.2.0
  font_awesome_flutter: ^10.7.0
  flutter_dotenv: ^6.0.0

  # In-App Purchases
  in_app_purchase: ^3.2.1
  in_app_purchase_android: ^0.4.0+6
  url_launcher: ^6.3.1

  # REST API Integration
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^7.0.0
  uuid: ^4.5.1

  # Local Database (Drift)
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.25
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation for Drift
  drift_dev: ^2.23.0
  build_runner: ^2.4.14


flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/splash/
    - assets/sounds/